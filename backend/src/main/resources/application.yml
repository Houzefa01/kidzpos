server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0       # écoute sur toutes les interfaces (LAN)

spring:
  application:
    name: kidzpos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jpa:
    hibernate:
      ddl-auto: validate  # Use Flyway for schema management, not Hibernate auto-ddl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true  # Allow migration on existing schema
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    # Silence "Broken pipe" qui spamme à chaque déconnexion SSE (comportement normal)
    "[org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/].[dispatcherServlet]]": OFF
    org.springframework.web.servlet.handler.HandlerExceptionResolver: ERROR

kidzpos:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-please-use-a-very-long-random-string-32+bytes}
    expiration-hours: 12
  cors:
    # Patterns autorisés (localhost + IPs LAN privées sur ports Vite/preview)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:4173,http://192.168.*.*:5173,http://192.168.*.*:4173,http://10.*.*.*:5173,http://10.*.*.*:4173,http://172.16.*.*:5173,http://172.17.*.*:5173,http://172.18.*.*:5173,http://172.19.*.*:5173,http://172.20.*.*:5173,http://172.21.*.*:5173,http://172.22.*.*:5173,http://172.23.*.*:5173,http://172.24.*.*:5173,http://172.25.*.*:5173,http://172.26.*.*:5173,http://172.27.*.*:5173,http://172.28.*.*:5173,http://172.29.*.*:5173,http://172.30.*.*:5173,http://172.31.*.*:5173}
  exchange:
    # Taux EUR -> Ariary par défaut (mis à jour si internet via /api/exchange/refresh)
    eur-to-ar-default: 4900

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kidzpos}
    username: ${DB_USER:kidzpos}
    password: ${DB_PASSWORD:kidzpos}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: sqlite
  datasource:
    url: jdbc:sqlite:${SQLITE_PATH:./kidzpos.db}?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1        # SQLite : une seule connexion simultanée
      minimum-idle: 1
      connection-timeout: 10000   # 10s avant de déclarer timeout
      idle-timeout: 600000
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create  # Recréer le schéma complet au démarrage (dev local)
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: false
