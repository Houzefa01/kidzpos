server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0       # écoute sur toutes les interfaces (LAN)
  # P2.2 : derrière un reverse-proxy (Caddy/nginx), Tomcat lit X-Forwarded-For
  # et expose la VRAIE IP cliente via req.getRemoteAddr() — utilisé par
  # LoginRateLimitFilter et RefreshRateLimitFilter. NATIVE n'accepte les headers
  # que depuis les proxies locaux par défaut (cf server.tomcat.remoteip.*).
  forward-headers-strategy: native
  tomcat:
    accesslog:
      enabled: true
      # Tomcat résout les chemins relatifs depuis catalina.base (tmp dir Spring Boot
      # embarqué), pas depuis le CWD. ./logs reste utilisable et reste à côté du
      # JAR sur la plupart des déploiements (start-server.sh crée ce dossier).
      # Pour forcer un chemin absolu en prod (/var/log/kidzpos, etc.), exporter
      # TOMCAT_ACCESSLOG_DIR — start-server.sh le fait déjà avec un absolu.
      directory: ${TOMCAT_ACCESSLOG_DIR:./logs}
      prefix: access
      suffix: .log
      buffered: false           # flush immédiat pour monitoring temps réel
      pattern: '%t %a "%r" %s %b %D ms'
      rotate: false

spring:
  application:
    name: kidzpos-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kidzpos}
    username: ${DB_USER:kidzpos}
    password: ${DB_PASSWORD:kidzpos}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate  # Use Flyway for schema management, not Hibernate auto-ddl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true  # Allow migration on existing schema
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        # prometheus exposé pour scraping ; metrics utile pour debug ; health pour LB.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    # Silence "Broken pipe" qui spamme à chaque déconnexion SSE (comportement normal)
    "[org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/].[dispatcherServlet]]": OFF
    org.springframework.web.servlet.handler.HandlerExceptionResolver: ERROR
    # Silence "Failure in @ExceptionHandler" pour les broken pipes SSE (cf GlobalExceptionHandler)
    "[org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver]": ERROR

kidzpos:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-please-use-a-very-long-random-string-32+bytes}
    # expiration-hours est conservé pour rétrocompat ; access-token-minutes prend
    # la précédence si défini. Recommandation P2 : 15 minutes.
    expiration-hours: 0
  auth:
    access-token-minutes: ${KIDZPOS_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${KIDZPOS_REFRESH_TOKEN_DAYS:30}
    # Cookie refresh httpOnly :
    #   cookie-secure  : false en LAN HTTP ; TRUE obligatoire en HTTPS prod
    #   cookie-same-site : Lax (LAN), Strict (prod same-origin), None (cross-origin HTTPS)
    cookie-secure: ${KIDZPOS_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${KIDZPOS_AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    # Patterns autorisés (localhost + IPs LAN privées sur ports Vite/preview, HTTP + HTTPS).
    # ⚠️ En prod derrière Caddy/nginx HTTPS : exporter CORS_ALLOWED_ORIGINS=https://kidzpos.monshop.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5173,http://localhost:4173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:4173,http://192.168.*.*:5173,https://192.168.*.*,http://192.168.*.*:4173,http://10.*.*.*:5173,https://10.*.*.*,http://10.*.*.*:4173,http://172.16.*.*:5173,http://172.17.*.*:5173,http://172.18.*.*:5173,http://172.19.*.*:5173,http://172.20.*.*:5173,http://172.21.*.*:5173,http://172.22.*.*:5173,http://172.23.*.*:5173,http://172.24.*.*:5173,http://172.25.*.*:5173,http://172.26.*.*:5173,http://172.27.*.*:5173,http://172.28.*.*:5173,http://172.29.*.*:5173,http://172.30.*.*:5173,http://172.31.*.*:5173}
  exchange:
    # Taux EUR -> Ariary par défaut (mis à jour si internet via /api/exchange/refresh)
    eur-to-ar-default: 4900
